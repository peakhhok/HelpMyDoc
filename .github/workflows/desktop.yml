name: Desktop build

# 윈도우용 설치 파일(설치형 + 포터블)을 만든다.
# - 수동 실행(Run workflow): 설치 파일을 만들어 산출물(Artifacts)로 올린다. 공개 Release 는 만들지 않는다.
# - v* 태그 푸시: 위와 같이 만든 뒤 GitHub Release 에 올린다. (앱의 자동 업데이트가 이 Release 를 본다)
# 맥·리눅스는 지금 배포하지 않는다.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "비워 두면 설치 파일만 만든다. v0.1.0 처럼 적으면 그 태그로 공개 Release 도 만든다."
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          # 코드 서명 인증서가 없으므로 서명을 건너뛴다 (서명되지 않은 빌드)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: List built files (installers and update info)
        run: ls release

      # 만든 앱을 실제 윈도우에서 실행해 본다. (창, 브리지, Codex 감지, PDF 렌더링)
      - name: Smoke test (unpacked)
        run: node scripts/smoke-desktop.cjs release/win-unpacked/HelpMyDoc.exe
      - name: Smoke test (after installing with the installer)
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "HelpMyDoc-Setup-*.exe" | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\HelpMyDoc\HelpMyDoc.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -ErrorAction SilentlyContinue | Format-Table Name
            throw "설치된 실행 파일을 찾을 수 없습니다: $exe"
          }
          node scripts/smoke-desktop.cjs $exe
      - name: Smoke test (portable exe)
        shell: pwsh
        run: |
          $portable = Get-ChildItem release -Filter "*portable.exe" | Select-Object -First 1
          node scripts/smoke-desktop.cjs $portable.FullName --http-only

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: HelpMyDoc-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
