name: Update test (Windows)

# 구버전(0.0.1)을 설치해 실행하면 로컬 서버의 신버전(0.0.2)을 받아 업데이트되는지 실제 윈도우에서 확인한다.
# 무겁기 때문에(설치 파일 2개 빌드) 수동으로만 실행한다.
on:
  workflow_dispatch:

jobs:
  update-flow:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build 0.0.1 and 0.0.2 installers that update from a local server
        shell: pwsh
        run: |
          node scripts/make-update-test-config.cjs http://127.0.0.1:8765/ release-old old.json
          node scripts/make-update-test-config.cjs http://127.0.0.1:8765/ release-new new.json
          npx electron-builder --win nsis --config old.json -c.extraMetadata.version=0.0.1 --publish never
          npx electron-builder --win nsis --config new.json -c.extraMetadata.version=0.0.2 --publish never
          Get-ChildItem release-new | Format-Table Name, Length
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Update flow test
        run: node scripts/smoke-update.cjs
